<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warda and Saad’s Walk Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff4ea; --ink:#3b2340; --muted:#7a5f80; --card:#ffffff; --line:#f1d3dc;
  --sky1:#ffd9a8; --sky2:#ffb4c6; --orb:#fff3b0; --stars:0;
  --hill1:#f7a8b8; --hill2:#e98fa6; --tree:#6fbf9a; --trunk:#8a5a4a; --ground:#f6c9a0; --path:#fde7cf; --dash:#e9a77b;
  --accent:#e0457b; --accent2:#2f8f83; --chip:#ffe3ec;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-mood="golden"]){
    --paper:#1f1530; --ink:#fbeaf1; --muted:#c7aed0; --card:#2c1f42; --line:#4a3466;
    --sky1:#2b1f55; --sky2:#5a3a82; --orb:#f4f1ff; --stars:1;
    --hill1:#43306b; --hill2:#372658; --tree:#2f6f66; --trunk:#4a3a52; --ground:#35264f; --path:#4a3768; --dash:#8f78b8;
    --accent:#ff7fa8; --accent2:#7fe0cf; --chip:#41294f; color-scheme:dark;
  }
}
:root[data-mood="moon"]{
  --paper:#1f1530; --ink:#fbeaf1; --muted:#c7aed0; --card:#2c1f42; --line:#4a3466;
  --sky1:#2b1f55; --sky2:#5a3a82; --orb:#f4f1ff; --stars:1;
  --hill1:#43306b; --hill2:#372658; --tree:#2f6f66; --trunk:#4a3a52; --ground:#35264f; --path:#4a3768; --dash:#8f78b8;
  --accent:#ff7fa8; --accent2:#7fe0cf; --chip:#41294f; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:600 17px/1.5 "Nunito",system-ui,sans-serif;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
main{max-width:760px;margin:0 auto;padding:20px 18px 60px}
h1,h2{font-family:"Bagel Fat One","Trebuchet MS",cursive;font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(38px,9vw,70px);color:var(--accent);margin-bottom:18px}
h2{font-size:clamp(26px,5.5vw,34px);margin-bottom:14px}
section{margin-top:44px}

.scene{position:relative;border-radius:28px;overflow:hidden;border:3px solid var(--line);cursor:pointer;touch-action:manipulation}
.scene svg{display:block;width:100%;height:auto}
.scroll{animation:scroll 16s linear infinite}
@keyframes scroll{to{transform:translateX(-800px)}}
.dashes{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:swing 1s ease-in-out infinite}
.leg.b{animation-delay:-.5s}
@keyframes swing{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.scarf{transform-box:fill-box;transform-origin:100% 50%;animation:flutter .9s ease-in-out infinite alternate}
@keyframes flutter{from{transform:rotate(-8deg) scaleX(1)}to{transform:rotate(10deg) scaleX(.85)}}
.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.twinkle{opacity:var(--stars);transition:opacity .6s}
.paused *{animation-play-state:paused!important}
.pop{position:absolute;pointer-events:none;color:var(--accent);font-size:26px;animation:rise 1.8s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-140px) scale(1.2);opacity:0}}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
button,input{font:inherit}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:800;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.btn[aria-pressed="true"]{outline:3px solid var(--accent2);outline-offset:2px}
.btn:focus-visible,input:focus-visible,.scene:focus-visible,canvas:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.counter{margin-left:auto;font-weight:800;color:var(--accent2)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px}
.panel .controls:first-child{margin-top:0}
input[type=range]{accent-color:var(--accent);width:140px}
.eq{display:flex;gap:4px;align-items:flex-end;height:26px;margin-left:auto}
.eq i{width:5px;height:6px;border-radius:3px;background:var(--accent2)}
.on .eq i{animation:eq .7s ease-in-out infinite alternate}
.on .eq i:nth-child(2){animation-delay:-.2s}.on .eq i:nth-child(3){animation-delay:-.4s}.on .eq i:nth-child(4){animation-delay:-.1s}
@keyframes eq{to{height:26px}}
canvas{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;border-radius:18px;border:2px solid var(--line);touch-action:none;cursor:grab}
.gbar{display:flex;justify-content:space-between;align-items:center;max-width:360px;margin:14px auto 0;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Warda and Saad’s Walk Time</h1>

  <div class="scene" id="scene" tabindex="0" role="img" aria-label="Warda and Saad walking hand in hand along a park path">
    <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky2)"/><stop offset="1" style="stop-color:var(--sky1)"/></linearGradient>
        <symbol id="trees" viewBox="0 0 800 300" width="800" height="300">
          <g style="fill:var(--trunk)"><rect x="70" y="170" width="12" height="62"/><rect x="290" y="160" width="12" height="72"/><rect x="520" y="175" width="12" height="57"/><rect x="705" y="165" width="12" height="67"/></g>
          <g style="fill:var(--tree)"><circle cx="76" cy="150" r="42"/><circle cx="296" cy="135" r="48"/><circle cx="526" cy="155" r="38"/><circle cx="711" cy="142" r="45"/></g>
          <g><rect x="410" y="130" width="5" height="102" style="fill:var(--trunk)"/><circle cx="412" cy="126" r="11" fill="#ffd36e"/></g>
          <g font-size="20"><text x="170" y="228">🌸</text><text x="620" y="230">🌼</text><text x="440" y="232">🌷</text></g>
        </symbol>
      </defs>
      <rect width="800" height="300" fill="url(#sky)"/>
      <circle cx="660" cy="68" r="32" style="fill:var(--orb)"/>
      <g class="twinkle" fill="#fff"><circle cx="90" cy="40" r="2"/><circle cx="220" cy="70" r="1.6"/><circle cx="380" cy="34" r="2"/><circle cx="520" cy="80" r="1.5"/><circle cx="740" cy="30" r="2"/><circle cx="300" cy="100" r="1.4"/></g>
      <path d="M0 200 Q120 120 260 190 T520 175 T800 190 V300 H0Z" style="fill:var(--hill1)"/>
      <path d="M0 225 Q160 160 330 215 T640 205 T800 215 V300 H0Z" style="fill:var(--hill2)"/>
      <g class="scroll"><use href="#trees" x="0" y="0"/><use href="#trees" x="800" y="0"/></g>
      <rect y="232" width="800" height="70" style="fill:var(--ground)"/>
      <rect y="250" width="800" height="40" style="fill:var(--path)"/>
      <line class="dashes" x1="0" y1="270" x2="800" y2="270" stroke-width="4" stroke-dasharray="24 24" stroke-linecap="round" style="stroke:var(--dash)"/>
      <g transform="translate(330 222)"><g class="bob">
        <rect class="leg a" x="-8" y="0" width="7" height="38" rx="3.5" fill="#2b3a67"/>
        <rect class="leg b" x="1" y="0" width="7" height="38" rx="3.5" fill="#2b3a67"/>
        <rect x="-12" y="-48" width="24" height="52" rx="10" fill="#5b8def"/>
        <circle cy="-62" r="12" fill="#f0c29b"/>
        <path d="M-12-64 Q-10-78 2-76 Q13-74 12-62 Q6-70 -4-68 Z" fill="#2a1f1a"/>
        <path d="M8-40 L32-14" stroke="#f0c29b" stroke-width="6" stroke-linecap="round"/>
      </g></g>
      <g transform="translate(396 222)"><g class="bob" style="animation-delay:-.25s">
        <rect class="leg a" x="-7" y="10" width="6" height="28" rx="3" fill="#f0c29b"/>
        <rect class="leg b" x="1" y="10" width="6" height="28" rx="3" fill="#f0c29b"/>
        <path d="M-12-46 H12 L22 14 H-22Z" fill="#f27aa0"/>
        <path d="M-22 10 H22 V14 H-22Z" fill="#fff" opacity=".6"/>
        <path d="M-13-62 Q-18-30 -10-18 L-8-60Z" fill="#2a1f1a"/>
        <circle cy="-62" r="11.5" fill="#f3c8a6"/>
        <path d="M-12-64 Q-8-78 4-76 Q14-72 12-62 Q4-68 -6-66 Z" fill="#2a1f1a"/>
        <path class="scarf" d="M-8-46 Q-30-52 -48-40 Q-32-34 -22-32 Q-34-26 -44-18 Q-20-20 -8-30Z" fill="#ffd36e"/>
        <path d="M-8-40 L-32-14" stroke="#f3c8a6" stroke-width="6" stroke-linecap="round"/>
      </g></g>
      <text class="beat" x="351" y="236" font-size="22" text-anchor="middle">❤️</text>
    </svg>
  </div>
  <div class="controls">
    <button class="btn" id="walkBtn">Pause</button>
    <button class="btn alt" id="moodBtn">Moonlit</button>
    <span class="counter" aria-live="polite"><span id="steps">0</span> steps</span>
  </div>

  <section>
    <h2>Music</h2>
    <div class="panel" id="musicPanel">
      <div class="controls">
        <button class="btn" id="playBtn">Play</button>
        <button class="btn alt" id="t0" aria-pressed="true">Sweet</button>
        <button class="btn alt" id="t1" aria-pressed="false">Dreamy</button>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="controls"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="60"></div>
    </div>
  </section>

  <section>
    <h2>Catch the hearts</h2>
    <div class="panel">
      <canvas id="game" tabindex="0" aria-label="Heart catching game. Drag or use arrow keys to move."></canvas>
      <div class="gbar"><span>❤️ <span id="score">0</span></span><span>⏱ <span id="time">30</span></span><span>Best <span id="best">0</span></span></div>
      <div class="controls" style="justify-content:center"><button class="btn" id="startBtn">Play</button></div>
    </div>
  </section>
</main>

<script>
(function(){
  var scene=document.getElementById('scene'), walkBtn=document.getElementById('walkBtn'), moodBtn=document.getElementById('moodBtn');
  var steps=0, walking=true, stepsEl=document.getElementById('steps');
  setInterval(function(){ if(walking){ steps+=2; stepsEl.textContent=steps; } },1000);
  walkBtn.onclick=function(){
    walking=!walking; scene.classList.toggle('paused',!walking);
    walkBtn.textContent=walking?'Pause':'Walk';
  };
  var root=document.documentElement;
  function isMoon(){
    var m=root.getAttribute('data-mood');
    if(m) return m==='moon';
    return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function label(){ moodBtn.textContent=isMoon()?'Golden hour':'Moonlit'; }
  moodBtn.onclick=function(){ root.setAttribute('data-mood',isMoon()?'golden':'moon'); label(); };
  label();

  function hearts(x,y,n){
    var rect=scene.getBoundingClientRect();
    for(var i=0;i<n;i++){
      var h=document.createElement('span');
      h.className='pop'; h.textContent=['❤','💗','💖','✨'][i%4];
      h.style.left=(x-rect.left+(Math.random()*60-30))+'px';
      h.style.top=(y-rect.top+(Math.random()*30-15))+'px';
      h.style.animationDelay=(i*0.08)+'s';
      scene.appendChild(h);
      setTimeout(function(el){return function(){el.remove();};}(h),2200);
    }
  }
  scene.addEventListener('click',function(e){ hearts(e.clientX,e.clientY,6); });
  scene.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); var r=scene.getBoundingClientRect(); hearts(r.left+r.width/2,r.top+r.height/2,6); }
  });

  /* ---------- Music (made with the browser, no files needed) ---------- */
  var AC=window.AudioContext||window.webkitAudioContext, ac, master, playing=false, step=0, nextT=0, tm, cur=0;
  var tracks=[
    {bpm:100,chords:[
      {b:130.81,a:[261.63,329.63,392,523.25,392,329.63,392,329.63]},
      {b:110,a:[220,261.63,329.63,440,329.63,261.63,329.63,261.63]},
      {b:87.31,a:[174.61,220,261.63,349.23,261.63,220,261.63,220]},
      {b:98,a:[196,246.94,293.66,392,293.66,246.94,293.66,246.94]}]},
    {bpm:70,chords:[
      {b:87.31,a:[174.61,220,261.63,329.63,261.63,220,261.63,220]},
      {b:130.81,a:[196,261.63,329.63,392,329.63,261.63,329.63,261.63]},
      {b:146.83,a:[220,293.66,349.23,440,349.23,293.66,349.23,293.66]},
      {b:98,a:[196,246.94,293.66,392,293.66,246.94,293.66,246.94]}]}
  ];
  function note(f,t,d,type,v){
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
  }
  function sched(){
    var tr=tracks[cur], spb=60/tr.bpm/2;
    while(nextT<ac.currentTime+.3){
      var ch=tr.chords[Math.floor(step/8)%tr.chords.length], k=step%8;
      note(ch.a[k],nextT,spb*2.2,'triangle',.22);
      if(k===0) note(ch.b,nextT,spb*7,'sine',.4);
      nextT+=spb; step++;
    }
  }
  var playBtn=document.getElementById('playBtn'), panel=document.getElementById('musicPanel'), vol=document.getElementById('vol');
  function setVol(){ if(master) master.gain.value=vol.value/100; }
  vol.oninput=setVol;
  playBtn.onclick=function(){
    if(!AC) return;
    if(!ac){ ac=new AC(); master=ac.createGain(); master.connect(ac.destination); setVol(); }
    if(!playing){
      ac.resume(); step=0; nextT=ac.currentTime+.05; tm=setInterval(sched,100); playing=true;
      playBtn.textContent='Pause'; panel.classList.add('on');
    } else {
      clearInterval(tm); playing=false; playBtn.textContent='Play'; panel.classList.remove('on');
    }
  };
  [0,1].forEach(function(i){
    document.getElementById('t'+i).onclick=function(){
      cur=i; step=0;
      document.getElementById('t0').setAttribute('aria-pressed',i===0);
      document.getElementById('t1').setAttribute('aria-pressed',i===1);
    };
  });

  /* ---------- Game: catch the hearts ---------- */
  var cv=document.getElementById('game'), g=cv.getContext('2d'), W=360, H=440;
  cv.width=W; cv.height=H;
  var gs={run:false,score:0,time:30,px:W/2,items:[],last:0,spawn:0,best:0,msg:'Tap Play'};
  var scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), bestEl=document.getElementById('best'), startBtn=document.getElementById('startBtn');
  function css(v){ return getComputedStyle(root).getPropertyValue(v).trim(); }
  function draw(){
    var gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,css('--sky2')); gr.addColorStop(1,css('--sky1'));
    g.fillStyle=gr; g.fillRect(0,0,W,H);
    g.fillStyle=css('--ground'); g.fillRect(0,H-36,W,36);
    g.textAlign='center'; g.textBaseline='middle';
    g.font='30px serif';
    gs.items.forEach(function(it){ g.fillText(it.e,it.x,it.y); });
    g.font='46px serif'; g.fillText('👫',gs.px,H-50);
    if(!gs.run){
      g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(0,H/2-44,W,88);
      g.fillStyle='#fff'; g.font='800 26px Nunito,sans-serif'; g.fillText(gs.msg,W/2,H/2);
    }
  }
  function hud(){ scoreEl.textContent=gs.score; timeEl.textContent=Math.max(0,Math.ceil(gs.time)); bestEl.textContent=gs.best; }
  function loop(t){
    if(!gs.run) return;
    var dt=Math.min(.05,(t-gs.last)/1000); gs.last=t;
    gs.time-=dt; gs.spawn-=dt;
    if(gs.spawn<=0){
      gs.spawn=Math.max(.3,.6-(30-gs.time)*.01);
      var r=Math.random(), e=r<.65?'❤️':(r<.78?'⭐':'💧');
      gs.items.push({e:e,x:24+Math.random()*(W-48),y:-20,v:150+(30-gs.time)*5});
    }
    gs.items=gs.items.filter(function(it){
      it.y+=it.v*dt;
      if(it.y>H-80&&it.y<H-20&&Math.abs(it.x-gs.px)<38){
        if(it.e==='❤️') gs.score+=1; else if(it.e==='⭐') gs.score+=3; else gs.score=Math.max(0,gs.score-2);
        return false;
      }
      return it.y<H+30;
    });
    if(gs.time<=0){
      gs.run=false; gs.best=Math.max(gs.best,gs.score); gs.msg='Score '+gs.score;
      startBtn.textContent='Play again';
    }
    hud(); draw();
    if(gs.run) requestAnimationFrame(loop);
  }
  startBtn.onclick=function(){
    gs.run=true; gs.score=0; gs.time=30; gs.items=[]; gs.spawn=0; gs.px=W/2;
    startBtn.textContent='Restart'; gs.last=performance.now(); cv.focus({preventScroll:true});
    requestAnimationFrame(loop);
  };
  function move(e){
    var r=cv.getBoundingClientRect();
    gs.px=Math.max(26,Math.min(W-26,(e.clientX-r.left)*W/r.width));
    if(!gs.run) draw();
  }
  cv.addEventListener('pointerdown',function(e){ cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener('pointermove',function(e){ if(e.buttons||e.pointerType==='touch') move(e); });
  cv.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){ gs.px=Math.max(26,gs.px-24); e.preventDefault(); }
    if(e.key==='ArrowRight'){ gs.px=Math.min(W-26,gs.px+24); e.preventDefault(); }
    if(!gs.run) draw();
  });
  moodBtn.addEventListener('click',function(){ setTimeout(function(){ if(!gs.run) draw(); },60); });
  hud(); draw();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(!gs.run) draw(); });
})();
</script>
</body>
</html>
